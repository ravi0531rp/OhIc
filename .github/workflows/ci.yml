name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app tests
      - name: Test backend
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package-macos:
    name: Versioned macOS DMG
    needs: [backend, frontend]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install system media tools
        run: brew install ffmpeg dylibbundler
      - run: npm ci
      - name: Install backend runtime
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Build versioned DMG
        env:
          OHIC_BUILD_VERSION: 0.1.1.${{ github.run_number }}-${{ github.sha }}
        run: chmod +x scripts/build-dmg.sh && scripts/build-dmg.sh
      - name: Smoke test mounted application
        run: scripts/smoke-dmg.sh release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OhIc-macos-0.1.1.${{ github.run_number }}-${{ github.sha }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
