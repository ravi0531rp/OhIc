name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app tests
      - name: Test backend
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package-macos:
    name: Versioned macOS DMG
    needs: [backend, frontend]
    runs-on: macos-14
    env:
      UV_PYTHON_PREFERENCE: only-managed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install relocatable Python
        run: uv python install 3.12
      - name: Install system media tools
        run: brew install ffmpeg dylibbundler
      - run: npm ci
      - name: Install backend runtime
        working-directory: backend
        run: uv sync --frozen --no-dev --python 3.12
      - name: Build versioned DMG
        env:
          OHIC_BUILD_VERSION: 0.1.1.${{ github.run_number }}-${{ github.sha }}
        run: chmod +x scripts/build-dmg.sh && scripts/build-dmg.sh
      - name: Smoke test mounted application
        run: scripts/smoke-dmg.sh release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OhIc-macos-0.1.1.${{ github.run_number }}-${{ github.sha }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Prepare public macOS test build
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/codex/feature-native-macos-app')
        run: cp release/*.dmg release/OhIc-macOS-Apple-Silicon.dmg
      - name: Publish rolling macOS test release
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/codex/feature-native-macos-app')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: native-macos-preview
          RELEASE_ASSET: release/OhIc-macOS-Apple-Silicon.dmg
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
              --title "OhIc native macOS preview" \
              --notes "Rolling Apple silicon test build. Built and smoke-tested by CI from $GITHUB_SHA." \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" --target "$GITHUB_SHA" --prerelease \
              --title "OhIc native macOS preview" \
              --notes "Rolling Apple silicon test build. Built and smoke-tested by CI from $GITHUB_SHA." \
              --repo "$GITHUB_REPOSITORY"
          fi
